# bootstrap.conf.yml
# Single host-wide configuration: provisioning capability flags and
# toolchain version pins.
#
# Copy this file to bootstrap.conf.yml and customise for each host.
# A hostname-specific override (<hostname>.conf.yml) is also supported
# — it takes precedence over bootstrap.conf.yml when present.
#
# ── Capabilities ────────────────────────────────────────────────────────────
#
# Each flag controls a group of init.d steps. Steps declare required
# capabilities via a `.requires` file in their step directory (one capability
# name per line). A step whose `.requires` lists at least one disabled
# capability is skipped. Steps without a `.requires` file always run.
#
# A capability is enabled ONLY when it is listed here and set to true.
# Unlisted capabilities are disabled, so host confs may omit disabled keys.
# This example is the canonical list of valid capability names. The
# capabilities block itself is required, and invalid names/values fail
# preflight rather than silently skipping steps.
#
#   docker  Docker CE + lazydocker. Required for any host that runs containers
#           (app servers, CI runners, registries).
#
#   kvm     KVM virtualization: qemu-kvm, libvirt, virtinst, bridge-utils.
#           Required for hosts that run VMs.
#
#   dev     Development-node tooling. Gates 06-playwright-deps (browser
#           system libraries), user/22-python-dev (Ruff only, unpinned upgrades
#           via uv using existing managed Python), user/25-go (Go toolchain),
#           user/39-playwright (per-user Node package and browser binaries),
#           user/97-gh-auth-instructions, and user/98-npm-shared +
#           user/99-go-shared (read-only access to Broadminde shared
#           repositories and packages — Go modules, frontend source/package
#           paths; deploy keys can be registered through gh by the interactive
#           github-access helper when the operator has permission). Enable on
#           hosts that build or test code. The user tier itself is NOT
#           capability-gated — baseline tooling such as user/20-python always
#           installs. Disabling/omitting dev skips provisioning, not removal of
#           existing tools. mypy/pytest/coverage remain project-owned.
#
#   public  CrowdSec IPS (LAPI + iptables bouncer + Central API). Enable on
#           internet-facing servers; disable on internal/private hosts.
#
#   caddy   Central Caddy reverse proxy (one per host, Docker). Installs to
#           ~/infra/caddy via the user tier and provides a shared edge reverse
#           proxy for all app stacks on the host. Snippets register via
#           caddy-route. Requires docker. Gated on both: docker AND caddy.
#
#   woodpecker  RETIRED — 45-woodpecker-local is .disabled. The local
#           backend agent runs as the deploy user via a user systemd unit
#           provisioned by the ci repo's init.d/20-agent-local.
#
#   cluster Root-owned bmcluster binary, locked account, private state and
#           disabled systemd unit. No Docker or Go dependency. Does not
#           initialize/join a cluster or open the firewall. See docs/cluster.md.

capabilities:
  docker: true
  caddy: true
  kvm: false
  dev: false
  public: false
  woodpecker: false
  cluster: false

# ── Versions ─────────────────────────────────────────────────────────────────
#
# Selects the installed version of each tool. Four formats are accepted:
#
#   "latest"   auto-resolve to the newest stable release at install time
#   "24"       resolve to the newest 24.x.y (major-only pin)
#   "1.26"     resolve to the newest 1.26.x (major.minor pin)
#   "1.26.4"   install exactly this version (fully-specified pin)
#
# Partial requests (numeric major or major.minor) are supported for python,
# go, and node. Python reuses matching uv-managed CPython without a patch
# upgrade; system Python does not satisfy the check. Python "latest" resolves
# from the selected uv's stable CPython catalog after uv installation/update,
# failing if no candidate is available rather than using a hardcoded fallback.
# uv, kilo, and caddy accept "latest" or a fully-specified version.
# Omit a user tool or caddy (or delete versions:) to default to "latest".
# Ruff has no pin or versions key: user/22-python-dev uses uv tool install
# --upgrade with an explicit existing managed Python and --no-python-downloads,
# never --force. uv resolves the latest compatible Ruff on each dev-enabled run.
# bmcluster requires an exact vMAJOR.MINOR.PATCH release tag (never latest).
# bmcluster has no latest fallback: cluster: true requires its exact pin.
#
# Supported tools: uv, python, kilo, go, node, caddy, bmcluster

versions:
  uv: "latest"
  python: "3.13"
  kilo: "latest"
  go: "latest"
  node: "latest"
  caddy: "2.11.7"
  bmcluster: ""  # Required only when cluster: true; set a published signed tag

# Cluster release trust and host binding. All fields are required for an
# opted-in installation, except discovery (off by default). Keep these empty
# until signed release assets and an out-of-band public key are available.
# release_base_url: HTTPS directory for the exact pinned tag's release assets.
# signing_key_file: absolute path to a root-owned (not group/world writable)
#   PEM Ed25519 public key provisioned out-of-band; never download it with
#   the release. Assets: bmcluster_<version>_linux_{amd64,arm64}, SHA256SUMS,
#   SHA256SUMS.sig (raw Ed25519 signature of SHA256SUMS).
# trusted_interface: existing private interface with the configured IP.
# control_ip: private IPv4 or ULA IPv6 address assigned to that interface.
# control_port: unprivileged TCP port 1024..65535. No UFW allow is created.
# discovery: off until two-host DNS-SD tests authorize enabling it.
cluster:
  release_base_url: ""
  signing_key_file: ""
  trusted_interface: ""
  control_ip: ""
  control_port: ""
  discovery: "off"

# ── Agent skills ─────────────────────────────────────────────────────────────
# Space-separated npx skills agent targets. Supported targets are defined by
# the skills CLI; keep this explicit to avoid installing into auto-detected
# agents. Kilo Code and Kilo CLI use the `kilo` target.

skills:
  agents: "kilo"

# ── Caddy wildcard zones ──────────────────────────────────────────────────────────
#
#   base_domain  Zone apex (e.g. "example.com"). A label L serves *.L.<base_domain>.
#                The special label "host" serves *.<hostname>.<base_domain>.
#                The special label "*" warms *.<base_domain> only; register
#                the apex <base_domain> separately as an app route.
#
#   wildcards    Space-separated DNS labels to render as wildcard zone
#                snippets. Each label must match ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$,
#                plus the special labels "*" and "host".
#                Wildcard rendering activates only after acmedns.json holds a
#                real acme-dns account (registered via bin/acmedns-register).
#                Set wildcards: "" (empty) to render no zone snippets.
#
#   acme_email   ACME account email for certificate issuance (expiry and
#                revocation notices). user/init.d/60-caddy writes it into
#                ~/infra/caddy/.env (ACME_EMAIL); leave empty to collect it
#                interactively via ~/scripts/bootstrap-access instead.
#
#   Example:  base_domain: example.com
#             wildcards: "* dev host"
#             acme_email: ops@example.com

caddy:
  base_domain: example.com
  wildcards: ""
  acme_email: ""

# Portal deployment mode. `dev` registers the host's Vite dev server with
# central Caddy; `image` deploys the published portal container image.
portal:
  mode: dev

# ── GitHub credential role ───────────────────────────────────────────────────
#
# Read by bootstrap-access (the interactive credential walk) when the dev
# capability is enabled. This is host credential breadth, NOT a capability:
# no init.d step is gated on it and no token is minted by flipping it —
# the walk validates/re-collects the stored classic PATs to match.
#
#   packages_write  true on publish hosts: the GitHub Packages PAT gets
#                   write:packages in addition to read:packages. Also set
#                   before running `github-access setup --ci`.
#   packages_read   true on Docker hosts that pull private GHCR images. A
#                   development host gets package-read access automatically.
#   source_rw       true on hosts that push source / open issues / PRs:
#                   collects the separate repo,workflow classic PAT.
#
# Keys are false when unlisted or absent — a dev host with no github:
# section gets read-only package access and no source RW token.

github:
  packages_read: false
  packages_write: false
  source_rw: false
